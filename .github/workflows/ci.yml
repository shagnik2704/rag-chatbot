name: CI / CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-backend:
    name: Backend Tests & PostgreSQL Integration
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: rag_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rag_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache HuggingFace Embedding Model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-bge-small-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-hf-bge-small-

      - name: Install Dependencies
        run: |
          uv pip install --system -e . pytest pytest-mock anyio

      - name: Initialize Database Schema
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rag_db
        run: |
          python -c "
          import asyncio
          from src.db.connection import get_db_pool, init_db

          async def main():
              pool = await get_db_pool()
              await init_db(pool)
              print('CI Database schema initialized.')

          asyncio.run(main())
          "

      - name: Index Document into PostgreSQL
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rag_db
        run: |
          python -c "
          import asyncio
          from src.embeddings.local_provider import LocalSentenceTransformerEmbeddings
          from src.vectorstore.postgres_store import PostgresVectorStore
          from src.services.indexing_service import IndexingService

          async def main():
              emb = LocalSentenceTransformerEmbeddings()
              vs = PostgresVectorStore()
              idx = IndexingService(vector_store=vs, embedding_provider=emb)
              chunks = await idx.aindex_document('data/raw/Future-Ready Children_ FAQ.docx', clear_existing=True)
              print(f'Successfully indexed {len(chunks)} chunks into CI PostgreSQL.')

          asyncio.run(main())
          "

      - name: Run Pytest Test Suite
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rag_db
          SARVAM_API_KEY: "mock_ci_key"
        run: |
          pytest -v

  build-frontend:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Frontend Bundle
        working-directory: ./frontend
        run: npm run build

  docker-build:
    name: Docker Container Build Verification
    needs: [test-backend, build-frontend]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: rag-chatbot:latest
