[project]
name = "rag-chatbot"
version = "0.1.0"
description = "Enterprise RAG Querying Chatbot using Sarvam AI GLM-5.3 and Hybrid Retrieval"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "pypdf>=4.2.0",
    "python-docx>=1.1.0",
    "chromadb>=0.5.0",
    "sentence-transformers>=2.7.0",
    "rank-bm25>=0.2.2",
    "tenacity>=8.3.0",
    "streamlit>=1.35.0",
    "click>=8.1.7",
    "rich>=13.7.1",
    "pytest>=8.2.0",
    "pytest-mock>=3.14.0",
    "asyncpg>=0.31.0",
    "pgvector>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
